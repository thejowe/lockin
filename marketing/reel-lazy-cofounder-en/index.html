<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #grain {
        position: absolute;
        inset: 0;
        z-index: 6;
        overflow: hidden;
        pointer-events: none;
        mix-blend-mode: overlay;
        opacity: 0.2;
      }
      #grain-tex {
        position: absolute;
        left: -200px;
        top: -200px;
        width: 1480px;
        height: 2320px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='360' height='360' filter='url(%23n)'/></svg>");
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <div
        id="room"
        data-composition-id="room"
        data-composition-src="compositions/room.html"
        data-start="0"
        data-duration="18.2"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="13"
        data-track-index="1"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>
      <div
        id="chat"
        data-composition-id="chat"
        data-composition-src="compositions/chat.html"
        data-start="6.6"
        data-duration="4"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="swipe"
        data-composition-id="swipe"
        data-composition-src="compositions/swipe.html"
        data-start="13"
        data-duration="5.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="18.2"
        data-duration="2.8"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 5"
      ></div>
      <!-- Voz (Kokoro local, am_michael): cada frase sobre su plano -->
      <audio id="vo-1" class="clip" data-start="0.3" data-duration="2.03" data-track-index="20" data-volume="1" src="assets/vo/l1.wav"></audio>
      <audio id="vo-2" class="clip" data-start="4.8" data-duration="1.77" data-track-index="20" data-volume="1" src="assets/vo/l2.wav"></audio>
      <audio id="vo-3" class="clip" data-start="11.3" data-duration="2.39" data-track-index="20" data-volume="1" src="assets/vo/l3.wav"></audio>
      <audio id="vo-4" class="clip" data-start="13.85" data-duration="1.3" data-track-index="20" data-volume="1" src="assets/vo/l4.wav"></audio>
      <audio id="vo-5" class="clip" data-start="18.55" data-duration="2.2" data-track-index="20" data-volume="1" src="assets/vo/l5.wav"></audio>
      <!-- Efectos: cada uno con su causa en pantalla. Créditos CC BY en .media/audio/sfx/CREDITS.md -->
      <audio id="sfx-typing" class="clip" data-start="0" data-duration="3.55" data-track-index="10" data-volume="0.28" data-fade-out="0.25" src=".media/audio/sfx/sfx_001.mp3"></audio>
      <audio id="sfx-chair" class="clip" data-start="3.62" data-duration="0.85" data-media-start="1.6" data-track-index="11" data-volume="0.7" data-fade-out="0.2" src=".media/audio/sfx/sfx_008.mp3"></audio>
      <audio id="sfx-phone-in-1" class="clip" data-start="6.55" data-duration="0.9" data-track-index="12" data-volume="0.45" data-fade-out="0.3" src=".media/audio/sfx/sfx_002.mp3"></audio>
      <audio id="sfx-tap-1" class="clip" data-start="7.43" data-duration="0.36" data-track-index="13" data-volume="0.8" src=".media/audio/sfx/sfx_003.mp3"></audio>
      <audio id="sfx-tap-2" class="clip" data-start="8.93" data-duration="0.36" data-track-index="13" data-volume="0.8" src=".media/audio/sfx/sfx_003.mp3"></audio>
      <audio id="sfx-tap-3" class="clip" data-start="9.93" data-duration="0.36" data-track-index="13" data-volume="0.9" src=".media/audio/sfx/sfx_003.mp3"></audio>
      <audio id="sfx-poof" class="clip" data-start="10.97" data-duration="0.72" data-track-index="14" data-volume="0.9" src=".media/audio/sfx/sfx_004.mp3"></audio>
      <audio id="sfx-thud" class="clip" data-start="11.27" data-duration="0.36" data-track-index="15" data-volume="0.8" src=".media/audio/sfx/sfx_005.mp3"></audio>
      <audio id="sfx-phone-in-2" class="clip" data-start="12.95" data-duration="0.6" data-track-index="12" data-volume="0.4" src=".media/audio/sfx/sfx_006.mp3"></audio>
      <audio id="sfx-swipe-1" class="clip" data-start="14.1" data-duration="0.58" data-track-index="16" data-volume="0.6" src=".media/audio/sfx/sfx_006.mp3"></audio>
      <audio id="sfx-swipe-2" class="clip" data-start="14.9" data-duration="0.58" data-track-index="16" data-volume="0.6" src=".media/audio/sfx/sfx_006.mp3"></audio>
      <audio id="sfx-swipe-3" class="clip" data-start="16.03" data-duration="0.9" data-track-index="17" data-volume="0.5" data-fade-out="0.3" src=".media/audio/sfx/sfx_002.mp3"></audio>
      <div id="grain" class="clip" data-start="0" data-duration="18.2" data-track-index="5" data-layout-ignore data-layout-allow-overflow><div id="grain-tex"></div></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // grano: la textura salta de sitio 12 veces por segundo (posiciones fijas, sin azar)
      const GX = [0, -90, 60, -150, 120, -40, 170, -120, 30, -180, 90, -60];
      const GY = [0, 110, -70, 40, -160, 150, -30, -120, 180, 70, -90, 20];
      for (let i = 0; i < Math.ceil(18.2 * 12); i++) tl.set("#grain-tex", { x: GX[i % 12], y: GY[(i * 5) % 12] }, i / 12);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
