name: Web pública

# Publica en GitHub Pages las páginas que exigen las tiendas (privacidad,
# soporte, eliminar cuenta, normas). La política se genera desde
# `docs/tiendas/privacidad.md`; ver `scripts/build-web.mjs`.
#
# Requiere activar una vez Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [claude/startup-cofounder-matching-app-tfeai1]
    paths:
      - 'web/**'
      - 'docs/tiendas/privacidad.md'
      - 'scripts/build-web.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; uno nuevo no cancela al que está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
