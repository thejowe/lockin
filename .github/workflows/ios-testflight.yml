name: iOS a TestFlight (build local)

# Alternativa al build en la nube de EAS cuando se agota la cuota del plan Free:
# `eas build --local` compila en este runner macOS (no gasta cuota de builds) y
# `eas submit` sube el .ipa a App Store Connect. Se lanza a mano desde Actions.
# Necesita el secreto EXPO_TOKEN (token de acceso de la cuenta thejowe en expo.dev).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Siempre con Xcode 27 / iOS SDK 27. macos-26 solo trae Xcode 26 (SDK 26.x): no usarlo.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: 0
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Xcode 27 más nuevo (iOS SDK 27 obligatorio)
        run: |
          ls -d /Applications/Xcode*.app
          x=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -n1)
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "::error::iOS SDK $sdk < 27. El build de iOS debe compilarse siempre con iOS SDK 27 o superior."
            exit 1
          fi
      - run: npm ci
      - name: Build local de iOS (perfil production)
        run: npx eas-cli build -p ios --profile production --local --non-interactive --output "$RUNNER_TEMP/lockin.ipa"
      - name: Subir a TestFlight
        run: npx eas-cli submit -p ios --profile production --path "$RUNNER_TEMP/lockin.ipa" --non-interactive
