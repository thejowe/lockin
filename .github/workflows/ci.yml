name: CI

# Cada push y cada PR pasa por aquí. Los cuatro trabajos son independientes a
# propósito: si el formato está mal, quieres seguir viendo si los tests pasan.
on:
  push:
    branches: ['**']
  pull_request:

# Un push nuevo sobre la misma rama cancela la ejecución anterior: nadie espera
# el resultado de un commit que ya ha sido reemplazado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Expo manda telemetría y comprueba actualizaciones; en CI solo añade ruido.
  EXPO_NO_TELEMETRY: '1'
  CI: 'true'

jobs:
  quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    strategy:
      # Sin fail-fast: un lint roto no debe ocultar un test roto.
      fail-fast: false
      matrix:
        task:
          - { name: Lint, run: npm run lint }
          - { name: Formato, run: npm run format:check }
          - { name: Tipos, run: npm run typecheck }
          # Con cobertura: es lo que hace efectivo el suelo de `coverageThreshold`.
          - { name: Tests, run: npm run test:coverage -- --ci }
          # El runner del E2E es Node puro y no entra en Jest ni en la cobertura
          # de `src/`. Aquí se comprueba lo que decide si un fallo del emulador
          # se reintenta y uno del caso no: `node --test` sobre `e2e/triage.mjs`.
          - { name: Runner E2E, run: npm run test:e2e }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente el lock y falla si
      # el lock y el package.json se han desincronizado.
      - run: npm ci

      - run: ${{ matrix.task.run }}

  build:
    name: Export web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El export de web es la comprobación más barata de que el bundle entero
      # se construye: resuelve todos los imports y renderiza las rutas estáticas.
      - run: npx expo export --platform web --output-dir dist

  # Lo que hacen las funciones SQL, no la forma del esquema. `schema-drift.yml`
  # aplica las migraciones a una Supabase desechable y compara la huella: eso
  # dice qué objetos existen, no cómo se comportan. Y el comportamiento de
  # `rate_session`, `ratable_session`, `session_rating_window_is_open`,
  # `session_both_attended` y `session_is_live` no lo ejecuta ningún otro sitio:
  # la suite de contrato se salta esos casos contra cualquier backend real
  # porque necesitan una sesión ya terminada y `propose_session` exige 5 minutos
  # de margen. En Postgres embebido sí, porque ahí se insertan filas con fecha
  # pasada.
  #
  # Va aquí y no en `schema-drift.yml` por dos razones: cuesta ~4 s sobre un
  # `npm ci` que ya está cacheado, y el trabajo remoto de schema-drift está en
  # rojo mientras el usuario no aplique la última migración —un rojo nuevo allí
  # no se distinguiría del esperado—.
  schema:
    name: SQL embebido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migraciones y RPC en PostgreSQL embebido
        run: |
          set -euo pipefail
          npm run test:schema | tee "$RUNNER_TEMP/schema-embedded.log"
          # `node --test` sale en verde tanto si un archivo de la lista no
          # existe como si todos sus tests se saltan. Esta línea la imprime el
          # test justo antes de cerrar, así que solo aparece si el cuerpo entero
          # llegó al final: es el control de que aquí se ha ejecutado SQL.
          grep -q 'Rol lector, 4 mutaciones, teardown dos veces y guardia de sobrecarga: OK' \
            "$RUNNER_TEMP/schema-embedded.log" \
            || { echo 'El SQL embebido no llegó a ejecutarse entero'; exit 1; }
