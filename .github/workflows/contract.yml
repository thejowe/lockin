name: Contrato Supabase
# La suite opt-in de `src/data/supabase/contract.test.ts` contra una Supabase
# local desechable (Docker del runner), nunca contra `grrzmzktrhksbttpbblg`.
# Allí se retiró `dev_reset_current_user()` el 2026-09-13 y sin ella la suite
# gasta un alta anónima por caso y choca con el límite de 30 por hora. Aquí la
# base sale de las migraciones del repo más `supabase/seed.sql`, que sí trae la
# función, y se tira al terminar.
#
# Corre en cada push a la rama principal, llamado desde `ci.yml` (job «Contrato
# Supabase»), y a mano en cualquier rama. En ramas de trabajo y en los PR no:
# levanta Docker y tarda ~10 minutos, y el motivo por el que nació opt-in
# —escribe usuarios y es lento— sigue siendo cierto.
#
# Lo que no se sostenía era que la mitad de Supabase del contrato no se
# ejecutara NUNCA sola. Un workflow que solo arranca a mano no se pone rojo
# solo: se queda con el veredicto de la última vez que alguien lo lanzó. Así se
# acumularon los once saltos sin declarar del 2026-09-16 y, antes, los nueve del
# 2026-09-15 (`docs/plan/todo/calidad.md`).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # Solo para autenticar el pull de las imágenes de Supabase desde ghcr.io
  # (paso de abajo). Son paquetes públicos: no da acceso a nada nuevo.
  packages: read
concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato de Repositories (Supabase local)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      RUNTIME: ${{ github.workspace }}/contract-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          # Misma versión que `e2e.yml`.
          version: 2.116.0
      - run: npm ci

      # Mismo motivo y mismo paso que en `e2e.yml`: las imágenes del Supabase
      # desechable salen de ghcr.io y el límite de descargas anónimas es por IP,
      # compartida por todo el pool de runners. El run 35899273763 de `E2E
      # Android` murió por eso (`toomanyrequests`) sin levantar un contenedor, y
      # este trabajo tira de las mismas imágenes.
      - name: Autenticar en ghcr.io (el límite anónimo es por IP y la IP es compartida)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Sin fijar el registro de imágenes, igual que `e2e/run.mjs:137-141`.
      # `setup-cli` exportaba `SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io` a todos
      # los pasos, y con esa fijación puesta la CLI 2.116.0 prueba ghcr.io y solo
      # ghcr.io: en el run 35910702023 los 34 `toomanyrequests` del log son todos
      # de `ghcr.io/supabase/…` y no aparece `public.ecr.aws` ni una vez, pese a
      # que el mensaje final diga «failed to pull docker image from all
      # registries». Sin la fijación, `GetRegistryImageUrls`
      # (`internal/utils/docker.go` de la v2.116.0) devuelve ECR, GHCR y origen
      # con las mismas etiquetas: los mismos contenedores, tres registros en vez
      # de uno.
      #
      # Honestidad sobre qué arregla esto HOY: nada, porque el 2026-09-24
      # `supabase/setup-cli` dejó de poner esa variable para CLI >= 2.108.0
      # (commit `45a513f`, al que apunta ya el tag `v3`), y desde entonces este
      # trabajo baja de ECR él solo. Queda como guarda de lo que sí puede
      # volver: fijar aquí una CLI anterior a la 2.108.0, o que la acción
      # recaiga. Y va en el shell del paso porque este workflow llama a
      # `supabase start` directamente, sin pasar por `run.mjs`.
      #
      # El `docker login` de arriba se queda: no cuesta nada y autentica el
      # intento de GHCR cuando ECR no traiga una etiqueta.
      - name: Supabase desechable con migraciones y seed del repo
        run: |
          set -euo pipefail
          unset SUPABASE_INTERNAL_IMAGE_REGISTRY
          mkdir -p "$RUNTIME"
          supabase --workdir "$RUNTIME" init
          config="$RUNTIME/supabase/config.toml"
          grep -q 'enable_anonymous_sign_ins = false' "$config" \
            || { echo 'Cambió el formato de config de Supabase'; exit 1; }
          sed -i \
            -e 's/^project_id = .*/project_id = "lockin-contract"/' \
            -e 's/enable_anonymous_sign_ins = false/enable_anonymous_sign_ins = true/' \
            "$config"
          cp -r supabase/migrations "$RUNTIME/supabase/migrations"
          # Solo el seed del repo: el de E2E añade triggers que aquí sobran.
          cp supabase/seed.sql "$RUNTIME/supabase/seed.sql"
          # Auth, Postgres, REST y Realtime reales; el resto no hace falta.
          supabase --workdir "$RUNTIME" start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
          supabase --workdir "$RUNTIME" db reset --local

      - name: Credenciales locales (y solo locales)
        run: |
          set -euo pipefail
          # La suite lee `.env.local` antes que el entorno: si existiera,
          # podría acabar hablando con el proyecto real.
          test ! -e .env.local || { echo '.env.local no debe existir aquí'; exit 1; }
          status=$(supabase --workdir "$RUNTIME" status -o json)
          url=$(jq -r .API_URL <<<"$status")
          key=$(jq -r .ANON_KEY <<<"$status")
          [ "$url" = 'http://127.0.0.1:54321' ] || { echo "API_URL inesperada: $url"; exit 1; }
          [ -n "$key" ] && [ "$key" != null ] || { echo 'Falta ANON_KEY local'; exit 1; }
          echo "::add-mask::$key"
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$url"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$key"
          } >> "$GITHUB_ENV"

      - name: Suite de contrato
        env:
          LOCKIN_SUPABASE_CONTRACT: '1'
        run: |
          set -euo pipefail
          # El reporter de Jest escribe en stderr; se guarda la salida entera
          # porque de ahí se lee la primera guarda.
          npx jest src/data/supabase/contract.test.ts --ci --json --outputFile=contract-result.json 2>&1 \
            | tee "$RUNNER_TEMP/contract.log"

          # Guarda 1 — la misma clase que la del job «SQL embebido» de `ci.yml`:
          # una línea que la propia suite imprime al terminar, exigida con
          # `grep -q`. Sin credenciales, `contract.test.ts:397` degrada su
          # `describe` a `describe.skip`; entonces Jest cierra con
          # «Test Suites: 1 skipped, 1 total» y sale en VERDE sin haber hablado
          # con ninguna base de datos. Esta línea solo aparece si el archivo
          # existía, se ejecutó y llegó entero al final.
          grep -q 'Test Suites: 1 passed, 1 total' "$RUNNER_TEMP/contract.log" \
            || { echo 'El contrato contra Supabase no llegó a ejecutarse entero (suite saltada: ¿faltan credenciales?)'; exit 1; }

          # Guarda 2 — sobre el JSON, y por caso. Los únicos saltos admitidos
          # son los casos
          # `itWithTimeTravel` de `repositories.contract.ts`, que necesitan reloj
          # simulado (`canTimeTravel: false` aquí; los cubren el mock y PGlite).
          # Un caso nuevo de ese tipo obliga a añadirlo a esta lista a propósito.
          # Los nueve de valoración se añadieron el 2026-09-15: necesitan una
          # sesión ya terminada y `propose_session` exige 5 minutos de margen,
          # así que aquí no se pueden fabricar. Su SQL lo ejecuta el job
          # "SQL embebido" de `ci.yml` (`npm run test:schema`).
          # Los seis de rachas son del mismo tipo y del mismo día, pero se
          # quedaron sin añadir: este job es opt-in (`workflow_dispatch`), así
          # que llevaba rojo desde entonces sin que nadie lo viera.
          # Los cinco de verificación se añadieron el 2026-09-16 y NO son de
          # reloj: se saltan por `canLinkIdentityWithoutBrowser: false`, porque
          # un OAuth de verdad necesita un navegador y una persona al otro lado.
          # Contra el mock corren enteros.
          jq -e '
            ([.testResults[].assertionResults[] | select(.status == "pending") | .title]
              - ["una propuesta caducada ya no está viva ni se puede aceptar",
                 "una sesión aceptada termina sola y deja proponer otra",
                 "una sesión empezada no se cancela: se sale",
                 "terminada con los dos dentro: se valora y deja de pedirse",
                 "con dos sin valorar se ofrece la más reciente",
                 "una cancelada o una rechazada nunca son valorables",
                 "sin tu asistencia no la valoras",
                 "si la otra persona no entró, tampoco",
                 "repetir el mismo valor es idempotente",
                 "mandar otro valor choca y no reescribe el primero",
                 "pasadas 24 horas la sesión se queda sin valorar",
                 "la otra persona del match no ve tu valoración",
                 "dos sesiones compartidas seguidas suman 2",
                 "un hueco de 7 días o más entre dos compartidas no las une",
                 "pasados 7 días del final de la última ya no hay racha",
                 "un plantón entre dos compartidas no rompe la racha",
                 "una cancelada entre dos compartidas no rompe la racha",
                 "valorar una sesión no cambia la racha de ninguno de los dos",
                 "al verificar, el enlace se deriva de la identidad",
                 "desverificar apaga el sello y vacía el enlace",
                 "un sello ya encendido sobrevive a guardar el perfil",
                 "resincronizar mantiene el sello que ya estaba",
                 "verificarse no reordena el deck de quien se verifica"]) as $unexpected
            | .numPassedTests > 0 and .numFailedTests == 0 and ($unexpected | length) == 0
          ' contract-result.json \
            || { echo 'La suite no corrió entera'; jq '{numPassedTests, numPendingTests, numFailedTests}' contract-result.json; exit 1; }
          jq '{numPassedTests, numPendingTests, numFailedTests}' contract-result.json

      - name: Resultado (también si falla)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-result
          path: contract-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Descartar backend local
        if: always()
        run: |
          if [ -f "$RUNTIME/supabase/config.toml" ]; then
            supabase --workdir "$RUNTIME" stop --no-backup
          fi
