name: E2E Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Dos ejecuciones del MISMO caso sobre el mismo backend levantado y el mismo
    # `adb reverse`. Lo único que cambia es si el APK lleva credenciales:
    #   supabase → debe pasar entero y dejar las filas en Postgres.
    #   mock     → debe fallar DESPUÉS del reinicio y no escribir nada.
    # Si el control negativo pasara en verde, el caso positivo no estaría
    # probando la integración; por eso corre en cada push, no solo a mano.
    #
    # Hubo una tercera, `probe`: una sonda de diagnóstico que corría
    # `keyboard-probe.yaml` con el APK de `supabase` para preguntar, por el
    # camino más corto, si el compositor quedaba por encima del teclado. Se
    # retiró el 2026-09-09 con la pregunta cerrada; el porqué está en
    # `e2e/README.md` y en `docs/plan/todo/calidad.md`.
    name: E2E Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    # Dos emuladores caben: build ~9 min y cada pasada de emulador ~15.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: supabase
            negative: '0'
          - variant: mock
            negative: '1'
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      E2E_NEGATIVE_CONTROL: ${{ matrix.negative }}
      E2E_ARTIFACTS: e2e/artifacts/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Herramientas 20.0, nuevo valor de v4; el emulador sigue en API 36.
          cmdline-tools-version: '14742923'
          # El valor por defecto es `tools platform-tools`, pero Google retiró
          # `tools` (SDK Tools 26, obsoleto) de repository2 el 2026-09-14 y
          # sdkmanager sale con código 1. Nada del trabajo lo usa: `run.mjs`
          # solo llama a `adb` y el emulator-runner instala lo suyo.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Expo genera Gradle después y fuera del checkout: el caché básico
          # falla sin archivos que hashear. Desactivarlo también evita cargar
          # el proveedor propietario que v6 usa por defecto.
          cache-disabled: true
      - uses: supabase/setup-cli@v3
        with:
          # v3 instala desde npm: fijar la versión evita autodetección o latest.
          version: 2.116.0
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Preparar evidencias
        run: mkdir -p "$E2E_ARTIFACTS"
      - name: Supabase desechable con migraciones reales
        id: backend
        run: node e2e/run.mjs prepare
      - name: Build release del APK (${{ matrix.variant }})
        id: build
        shell: bash
        run: node e2e/run.mjs build 2>&1 | tee "$E2E_ARTIFACTS/build.log"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # El emulador de Actions es inestable: `device offline` y
      # `StatusRuntimeException: UNAVAILABLE` tumbaron 3 de los 7 trabajos del
      # 2026-09-07 sin relación con el código. De ahí los dos pasos: el primero
      # no decide nada (`continue-on-error`), `triage` lee el veredicto que
      # `run.mjs` deja en el artefacto y SOLO si fue una caída del runner se
      # arranca otro AVD. Un fallo real del caso no se reintenta nunca — se
      # reintentaría el bug hasta verlo verde, que es el fallo que esto evita.
      # Quien falla el trabajo es `gate`, al final y con todos los intentos.
      - name: UI y persistencia real
        id: journey
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/run.mjs test
      - name: ¿Se cayó el runner o falló el caso?
        id: triage
        if: always()
        run: node e2e/run.mjs triage
      # Mismo AVD, arrancado de cero: cubre el emulador que muere entero, que es
      # lo que el reintento interno de `run.mjs` no puede arreglar desde dentro.
      - name: UI y persistencia real (segundo emulador, tras caída del runner)
        id: journey_retry
        if: steps.journey.outcome == 'failure' && steps.triage.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/run.mjs test
      - name: Estado de las fases (también si no se alcanza Maestro)
        if: always()
        env:
          PHASES: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s\n' "$PHASES" > "$E2E_ARTIFACTS/phases.json"
          df -h > "$E2E_ARTIFACTS/disk.txt"
      # Antes de subir la evidencia y de `stop`, que retira los contenedores.
      - name: Logs de PostgREST y GoTrue con marcas de tiempo
        if: always()
        run: node e2e/run.mjs containers
      - name: Evidencia (también si falla)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-${{ matrix.variant }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Descartar backend local
        if: always()
        run: node e2e/run.mjs stop
      # Ultimo paso a propósito: la evidencia ya está subida y el backend
      # apagado cuando este decide el color del trabajo.
      # `conclusion != 'skipped'`: si lo que falló fue el backend o el build, el
      # trabajo ya está rojo por su cuenta y este paso solo añadiría un mensaje
      # confuso sobre un veredicto que nadie llegó a escribir.
      - name: Resultado del recorrido (${{ matrix.variant }})
        if: always() && steps.journey.conclusion != 'skipped'
        run: node e2e/run.mjs gate
