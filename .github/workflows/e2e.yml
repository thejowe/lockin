name: E2E Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Supabase desechable con migraciones reales
        run: node e2e/run.mjs prepare
      - name: Build release con JS y credenciales locales embebidos
        run: node e2e/run.mjs build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI y persistencia real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/run.mjs test
      - name: Evidencia (también si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Descartar backend local
        if: always()
        run: node e2e/run.mjs stop
