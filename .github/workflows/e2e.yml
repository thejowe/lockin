name: E2E Android
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Dos ejecuciones del MISMO caso sobre el mismo backend levantado y el mismo
    # `adb reverse`. Lo único que cambia es si el APK lleva credenciales:
    #   supabase → debe pasar entero y dejar las filas en Postgres.
    #   mock     → debe fallar DESPUÉS del reinicio y no escribir nada.
    # Si el control negativo pasara en verde, el caso positivo no estaría
    # probando la integración; por eso corre en cada push, no solo a mano.
    name: E2E Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: supabase
            negative: '0'
            probe: '0'
          - variant: mock
            negative: '1'
            probe: '0'
          # Sonda temporal: mismo APK que `supabase`, otro .yaml, camino corto
          # hasta el compositor con el teclado abierto. Segundo tiro a la misma
          # pregunta en la misma pasada. Se retira con el compositor verificado.
          - variant: probe
            negative: '0'
            probe: '1'
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      E2E_NEGATIVE_CONTROL: ${{ matrix.negative }}
      E2E_KEYBOARD_PROBE: ${{ matrix.probe }}
      E2E_ARTIFACTS: e2e/artifacts/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Preparar evidencias
        run: mkdir -p "$E2E_ARTIFACTS"
      - name: Supabase desechable con migraciones reales
        id: backend
        run: node e2e/run.mjs prepare
      - name: Build release del APK (${{ matrix.variant }})
        id: build
        shell: bash
        run: node e2e/run.mjs build 2>&1 | tee "$E2E_ARTIFACTS/build.log"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI y persistencia real
        id: journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node e2e/run.mjs test
      - name: Estado de las fases (también si no se alcanza Maestro)
        if: always()
        env:
          PHASES: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s\n' "$PHASES" > "$E2E_ARTIFACTS/phases.json"
          df -h > "$E2E_ARTIFACTS/disk.txt"
      - name: Evidencia (también si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-${{ matrix.variant }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Descartar backend local
        if: always()
        run: node e2e/run.mjs stop
