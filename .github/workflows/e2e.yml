name: E2E Android
on:
  # Un commit que solo toca `docs/` no cambia código ni esquema: no gasta minutos.
  push:
    branches: ['**']
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  # Solo para que `docker login ghcr.io` (abajo) autentique el pull de las
  # imágenes de Supabase. Son paquetes públicos: no da acceso a nada nuevo.
  packages: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    # Dos ejecuciones del MISMO caso sobre el mismo backend levantado y el mismo
    # `adb reverse`. Lo único que cambia es si el APK lleva credenciales:
    #   supabase → debe pasar entero y dejar las filas en Postgres.
    #   mock     → debe fallar DESPUÉS del reinicio y no escribir nada.
    # Si el control negativo pasara en verde, el caso positivo no estaría
    # probando la integración; por eso corre en cada push, no solo a mano.
    #
    # La tercera, `registro`, no es otra ejecución de ese caso sino un caso
    # propio (`register.yaml` + `register-confirm.yaml`): la puerta de cuenta
    # obligatoria se decide al compilar, y el APK de `supabase` la lleva apagada.
    #
    # Hubo una tercera, `probe`: una sonda de diagnóstico que corría
    # `keyboard-probe.yaml` con el APK de `supabase` para preguntar, por el
    # camino más corto, si el compositor quedaba por encima del teclado. Se
    # retiró el 2026-09-09 con la pregunta cerrada; el porqué está en
    # `e2e/README.md` y en `docs/plan/todo/calidad.md`.
    name: E2E Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    # Dos emuladores caben: build ~9 min y cada pasada de emulador ~15.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: supabase
            negative: '0'
          - variant: mock
            negative: '1'
          # El alta con email obligatoria, de punta a punta: su APK es el único
          # con la puerta de cuenta encendida (`buildEnv` en `e2e/run.mjs`), y
          # recorre «Crea tu cuenta», el correo que GoTrue deja en Mailpit, el
          # enlace de vuelta por `cofounder://auth/callback` y la contraseña.
          - variant: registro
            negative: '0'
            registration: '1'
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      E2E_NEGATIVE_CONTROL: ${{ matrix.negative }}
      E2E_REGISTRATION: ${{ matrix.registration || '0' }}
      E2E_ARTIFACTS: e2e/artifacts/${{ matrix.variant }}
    steps:
      # Desde el 2026-10-03 hacia las 13:20 UTC el disco del runner (72 GB) se
      # llena al 100 % a mitad del trabajo en TODAS las ramas, también en las
      # que no llevan ningún cambio de dependencias (run 37125989089: el propio
      # agente del runner muere sin poder escribir su log). Es la imagen de
      # GitHub, no el código: el runner arranca con solo 14 GB libres y 7.8 GB
      # de RAM (run 37145112279). Se borra lo preinstalado que este trabajo no
      # usa: .NET, Haskell, Swift, CodeQL, Boost, PowerShell, Julia, Azure,
      # Python/PyPy/Go/Ruby del toolcache, Miniconda, Google Cloud SDK,
      # Chromium, AWS CLI, las imágenes Docker de serie (las de Supabase se
      # bajan después) y los NDK que no son el del build (27.1.12297006, el de
      # React Native 0.86). Nada de Java, Node, Docker ni del resto del SDK de
      # Android: el build y el emulador los necesitan. Con 8 GB de swap la
      # imagen del AVD ya no cabía (run 37145112279); 4 GB bastan contra el
      # `exit code 143` de memoria del run 37140026377.
      - name: Liberar disco y añadir swap
        run: |
          df -h /
          free -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/julia* /opt/az /opt/microsoft \
            /opt/hostedtoolcache/Python /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Ruby /usr/share/miniconda /usr/lib/google-cloud-sdk \
            /usr/local/share/chromium /opt/google /usr/local/aws-cli /usr/local/aws-sam-cli
          find /usr/local/lib/android/sdk/ndk -mindepth 1 -maxdepth 1 ! -name '27.1.12297006' \
            -exec sudo rm -rf {} +
          docker image prune -af > /dev/null
          sudo fallocate -l 4G /swapfile-e2e
          sudo chmod 600 /swapfile-e2e
          sudo mkswap /swapfile-e2e
          sudo swapon /swapfile-e2e
          df -h /
          free -h
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # Herramientas 20.0, nuevo valor de v4; el emulador sigue en API 36.
          cmdline-tools-version: '14742923'
          # El valor por defecto es `tools platform-tools`, pero Google retiró
          # `tools` (SDK Tools 26, obsoleto) de repository2 el 2026-09-14 y
          # sdkmanager sale con código 1. Nada del trabajo lo usa: `run.mjs`
          # solo llama a `adb` y el emulator-runner instala lo suyo.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Expo genera Gradle después y fuera del checkout: el caché básico
          # falla sin archivos que hashear. Desactivarlo también evita cargar
          # el proveedor propietario que v6 usa por defecto.
          cache-disabled: true
      - uses: supabase/setup-cli@v3
        with:
          # v3 instala desde npm: fijar la versión evita autodetección o latest.
          # 2.118.0 fue la primera estable con PostgREST v16.3 (arreglo del
          # PGRST303); la 2.119.0 levanta v16.4. `run.mjs prepare` falla si la
          # CLI levanta un PostgREST anterior a v16.3.
          version: 2.119.0
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip -o /tmp/maestro.zip
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
          echo "$HOME/.maestro/maestro/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # Las imágenes del Supabase desechable (postgres, kong, gotrue, realtime,
      # storage-api, postgres-meta, postgrest) salen de ghcr.io, y hasta hoy se
      # bajaban ANÓNIMAMENTE: ahí el límite de descargas es por IP, y la IP la
      # comparte todo el pool de runners de Actions. El run 35899273763 murió
      # por eso en sus TRES trabajos, en `Supabase desechable con migraciones
      # reales` y sin levantar un contenedor: `toomanyrequests: retry-after:
      # …, allowed: 44000/minute`. Autenticado, el límite pasa a ser de la
      # cuenta que autentica, así que deja de depender de lo que estén tirando
      # los demás repos del pool.
      #
      # El `GITHUB_TOKEN` del propio trabajo basta para LEER paquetes públicos
      # de otras organizaciones (`supabase/*`); no se necesita ningún secreto
      # nuevo ni se gana acceso a nada que no fuera ya público.
      - name: Autenticar en ghcr.io (el límite anónimo es por IP y la IP es compartida)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Preparar evidencias
        run: mkdir -p "$E2E_ARTIFACTS"
      - name: Supabase desechable con migraciones reales
        id: backend
        run: node e2e/run.mjs prepare
      - name: Build release del APK (${{ matrix.variant }})
        id: build
        shell: bash
        run: node e2e/run.mjs build 2>&1 | tee "$E2E_ARTIFACTS/build.log"
      # Con el APK hecho, los daemons de Gradle y Kotlin ya no hacen nada pero
      # retienen varios GB. En el runner de 7.8 GB de RAM el AVD se quedaba sin
      # aire y el sistema del emulador entraba en ANR («System UI isn't
      # responding» tapando la app en los 4 intentos de las 3 variantes, run
      # 37147445250). Se paran antes de arrancar el emulador.
      - name: Liberar memoria tras el build
        if: always()
        run: |
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          sleep 3
          free -h
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # El emulador de Actions es inestable: `device offline` y
      # `StatusRuntimeException: UNAVAILABLE` tumbaron 3 de los 7 trabajos del
      # 2026-09-07 sin relación con el código. De ahí los dos pasos: el primero
      # no decide nada (`continue-on-error`), `triage` lee el veredicto que
      # `run.mjs` deja en el artefacto y SOLO si fue una caída del runner se
      # arranca otro AVD. Un fallo real del caso no se reintenta nunca — se
      # reintentaría el bug hasta verlo verde, que es el fallo que esto evita.
      # Quien falla el trabajo es `gate`, al final y con todos los intentos.
      - name: UI y persistencia real
        id: journey
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Sin diálogos de error del sistema: en el runner de 7.8 GB el AVD
          # recién arrancado mete un ANR de Google Play Services o de la
          # System UI que tapaba la app en casi todos los intentos (run
          # 37150674444). Cuando no salía, los seis flujos de `supabase`
          # pasaban enteros. Ocultarlo no oculta nada de la app: un cuelgue de
          # cofounder sigue haciendo fallar la aserción.
          script: |
            adb shell settings put global hide_error_dialogs 1
            node e2e/run.mjs test
      - name: ¿Se cayó el runner o falló el caso?
        id: triage
        if: always()
        run: node e2e/run.mjs triage
      # Mismo AVD, arrancado de cero: cubre el emulador que muere entero, que es
      # lo que el reintento interno de `run.mjs` no puede arreglar desde dentro.
      - name: UI y persistencia real (segundo emulador, tras caída del runner)
        id: journey_retry
        if: steps.journey.outcome == 'failure' && steps.triage.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Sin diálogos de error del sistema: en el runner de 7.8 GB el AVD
          # recién arrancado mete un ANR de Google Play Services o de la
          # System UI que tapaba la app en casi todos los intentos (run
          # 37150674444). Cuando no salía, los seis flujos de `supabase`
          # pasaban enteros. Ocultarlo no oculta nada de la app: un cuelgue de
          # cofounder sigue haciendo fallar la aserción.
          script: |
            adb shell settings put global hide_error_dialogs 1
            node e2e/run.mjs test
      - name: Estado de las fases (también si no se alcanza Maestro)
        if: always()
        env:
          PHASES: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s\n' "$PHASES" > "$E2E_ARTIFACTS/phases.json"
          df -h > "$E2E_ARTIFACTS/disk.txt"
      # Antes de subir la evidencia y de `stop`, que retira los contenedores.
      - name: Logs de PostgREST y GoTrue con marcas de tiempo
        if: always()
        run: node e2e/run.mjs containers
      # Run 37154154048: todos los flujos de UI pasaron, pero el oráculo acabó
      # en «fetch failed» contra el Supabase local tras el último flujo. Para
      # saber si murió un contenedor (y si fue el OOM del kernel en el runner
      # de 7.8 GB), memoria, estado de cada contenedor y el final del log de
      # Kong quedan en la evidencia.
      - name: Memoria y contenedores al final
        if: always()
        run: |
          {
            free -h
            docker ps -a --format '{{.Names}} {{.Status}}'
            sudo dmesg | grep -iE 'out of memory|killed process' | tail -20 || true
            docker logs --tail 40 supabase_kong_lockin-e2e 2>&1 || true
          } | tee "$E2E_ARTIFACTS/memoria-contenedores.txt"
      - name: Evidencia (también si falla)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android-${{ matrix.variant }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Descartar backend local
        if: always()
        run: node e2e/run.mjs stop
      # Ultimo paso a propósito: la evidencia ya está subida y el backend
      # apagado cuando este decide el color del trabajo.
      # `conclusion != 'skipped'`: si lo que falló fue el backend o el build, el
      # trabajo ya está rojo por su cuenta y este paso solo añadiría un mensaje
      # confuso sobre un veredicto que nadie llegó a escribir.
      - name: Resultado del recorrido (${{ matrix.variant }})
        if: always() && steps.journey.conclusion != 'skipped'
        run: node e2e/run.mjs gate
