# Registro obligatorio con email, segunda mitad: la vuelta del enlace, la
# contraseña que se pone sola y la puerta abierta. Lo lanza run.mjs DESPUÉS de
# abrir el enlace del correo con `am start`, así que la app ya está en
# `/auth/callback` canjeando el código. Sin `launchApp` al principio a propósito:
# relanzar la app mataría ese canje a medias.
appId: app.cofounder.mobile
name: Registro con email (2/2) — volver del correo, contraseña aplicada y perfil relleno
---
- assertTrue: ${EMAIL && PASSWORD}
# El callback, sin perfil todavía, devuelve a `/register`: la cuenta ya es
# recuperable, así que pone la contraseña elegida en la primera mitad (la que
# esperaba en el almacén seguro) y sigue al formulario de perfil. run.mjs
# comprueba después contra GoTrue que esa contraseña entra.
- extendedWaitUntil:
    visible: 'Paso 4 de 4'
    timeout: 60000
- assertNotVisible: 'Elige tu contraseña'
# «Sobre ti» llega ya puesto en el formulario.
- assertVisible: 'Ana E2E'
- assertVisible: 'Barcelona'
# Y la puerta sigue abierta tras reiniciar: pregunta al servidor en cada montaje,
# así que esto no lo puede sostener ningún estado en memoria de la app.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Paso 4 de 4'
    timeout: 60000
- assertNotVisible: 'Crea tu cuenta'
