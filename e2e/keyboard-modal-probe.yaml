# SONDA DE DIAGNÓSTICO, no es una prueba de producto. Se puede borrar en cuanto
# cierre la pregunta que la motiva.
#
# Pregunta: ¿el `Modal` de match es lo que deja el compositor debajo del teclado?
#
# `react-native-keyboard-controller` suspende el callback de teclado de la
# ventana principal en cuanto se muestra un Modal, y solo lo reanuda en el
# `OnDismissListener` del diálogo (ModalAttachedWatcher.kt:66 y :89). Si ese
# listener no dispara al cerrar el modal de match, el callback queda suspendido
# y el compositor no vuelve a moverse en toda la sesión.
#
# Cómo se responde: este flujo llega al chat en un proceso que NUNCA ha mostrado
# un Modal. Crea el perfil y el match como siempre —eso sí pasa por el modal—,
# pero NO escribe nada; reinicia la app y entra al chat desde Matches, que no
# abre ningún Modal. El proceso nuevo arranca con el callback limpio.
#
#   - Si aquí el compositor SÍ sube  -> el Modal es la causa, confirmada.
#   - Si aquí TAMPOCO sube           -> el Modal es inocente; la causa está en
#                                       el montaje de KeyboardAvoidingView o en
#                                       edge-to-edge, y hay que mirar ahí.
#
# Necesita persistencia real, así que solo tiene sentido con el APK de Supabase:
# con el mock el perfil y el match no sobreviven al reinicio.
appId: app.lockin.mobile
name: Sonda - el compositor sin Modal previo
---
- assertTrue: ${PROFILE_NAME && MESSAGE}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Cofundador'
    timeout: 60000
- tapOn: 'Ambos'
- tapOn: 'Continuar'
- tapOn:
    text: 'Nombre|Cómo te llamas'
    below: 'Nombre'
- inputText: ${PROFILE_NAME}
- tapOn:
    text: 'Edad|28'
    below: 'Edad'
- inputText: '28'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Ubicación|Barcelona'
      below: 'Ubicación'
    direction: DOWN
- tapOn:
    text: 'Ubicación|Barcelona'
    below: 'Ubicación'
- inputText: 'Barcelona'
- hideKeyboard
- scrollUntilVisible:
    element: 'Desarrollo'
    direction: DOWN
- tapOn: 'Desarrollo'
- scrollUntilVisible:
    element: 'Solo ganas'
    direction: DOWN
- tapOn: 'Solo ganas'
- scrollUntilVisible:
    element: 'Tarde · 12–20'
    direction: DOWN
- tapOn: 'Tarde · 12–20'
- scrollUntilVisible:
    element: 'En serio, con equilibrio'
    direction: DOWN
- tapOn: 'En serio, con equilibrio'
- scrollUntilVisible:
    element:
      text: 'Lo que quiero construir es…|Tu respuesta'
      below: 'Busco a alguien que…'
    direction: DOWN
- tapOn:
    text: 'Lo que quiero construir es…|Tu respuesta'
    below: 'Busco a alguien que…'
- inputText: 'Una herramienta para construir en equipo'
- hideKeyboard
- scrollUntilVisible:
    element: 'Crear perfil'
    direction: DOWN
- tapOn: 'Crear perfil'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 60000
- tapOn: 'Like'
# El modal de match aparece aquí. Se atraviesa sin escribir nada: lo que importa
# es que el proceso SIGUIENTE no lo vea.
- extendedWaitUntil:
    visible: '¡Match!'
    timeout: 30000
- tapOn: 'Abrir chat'
- extendedWaitUntil:
    visible: 'Mensaje'
    timeout: 30000
# Proceso nuevo. A partir de aquí no se muestra ningún Modal en toda la sesión.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Descubrir'
    timeout: 60000
- assertNotVisible: 'Paso 1 de 2'
- tapOn: 'Matches'
- extendedWaitUntil:
    visible: 'Conversación con .*'
    timeout: 30000
- tapOn: 'Conversación con .*'
- extendedWaitUntil:
    visible: 'Mensaje'
    timeout: 30000
# Aquí está la pregunta. Con el teclado abierto, ¿sigue alcanzable el botón?
- tapOn: 'Mensaje'
- inputText: ${MESSAGE}
- assertVisible: 'Enviar mensaje'
- tapOn: 'Enviar mensaje'
- hideKeyboard
- assertVisible: ${MESSAGE}
