# AVISO: si corre contra el mock NO demuestra integración con Supabase.
# active.ts elige por credenciales. seed.sql y mock/seed.ts tienen los mismos
# ocho nombres. La persistencia tras stopApp + launchApp distingue Postgres del
# estado en memoria de mock/store.ts. NO quitar el reinicio ni recrear el perfil.
# Ejecutar mediante run.mjs: además verifica las filas reales. No usar Expo Go.
# El orden del deck lo fija el `update` de `created_at` de `incoming-likes.sql`:
# lo que se afirma de la tarjeta son datos de una persona concreta, y sin un
# orden fijo no querrían decir nada. `full-journey.test.mjs` fija esa relación.
appId: app.lockin.mobile
name: Alta, perfil, deck, match, mensaje y persistencia
---
- assertTrue: ${PROFILE_NAME && MESSAGE && (DECK_FIXTURE == 'postgres' || DECK_FIXTURE == 'memoria')}
# Registro actual: Auth anónimo automático; no existe pantalla de login.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Cofundador'
    timeout: 60000
- tapOn: 'Ambos'
- tapOn: 'Continuar'
- tapOn:
    text: 'Nombre|Cómo te llamas'
    below: 'Nombre'
- inputText: ${PROFILE_NAME}
- tapOn:
    text: 'Edad|28'
    below: 'Edad'
- inputText: '28'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: 'Ubicación|Barcelona'
      below: 'Ubicación'
    direction: DOWN
- tapOn:
    text: 'Ubicación|Barcelona'
    below: 'Ubicación'
- inputText: 'Barcelona'
- hideKeyboard
- scrollUntilVisible:
    element: 'Desarrollo'
    direction: DOWN
- tapOn: 'Desarrollo'
# Marketing no es decorado: es lo que hace aparecer el ✓ en la primera tarjeta
# del deck, porque Núria busca marketing y ventas.
- scrollUntilVisible:
    element: 'Marketing'
    direction: DOWN
- tapOn: 'Marketing'
# "Lo que debe dominar quien busco". Solo se pinta con `par` o `ambos` —aquí,
# `ambos`—: es la invariante de `Profile.seekingSpecialties`. Se toca por su
# etiqueta de accesibilidad porque "Diseño" nombra dos chips de esta pantalla,
# el que domino y el que busco, y por texto visible serían el mismo.
- scrollUntilVisible:
    element: 'Busco Diseño'
    direction: DOWN
- tapOn: 'Busco Diseño'
- scrollUntilVisible:
    element: 'Solo ganas'
    direction: DOWN
- tapOn: 'Solo ganas'
- scrollUntilVisible:
    element: 'Tarde · 12–20'
    direction: DOWN
- tapOn: 'Tarde · 12–20'
- scrollUntilVisible:
    element: 'En serio, con equilibrio'
    direction: DOWN
- tapOn: 'En serio, con equilibrio'
- scrollUntilVisible:
    element:
      text: 'Lo que quiero construir es…|Tu respuesta'
      below: 'Busco a alguien que…'
    direction: DOWN
- tapOn:
    text: 'Lo que quiero construir es…|Tu respuesta'
    below: 'Busco a alguien que…'
- inputText: 'Una herramienta para construir en equipo'
- hideKeyboard
- scrollUntilVisible:
    element: 'Crear perfil'
    direction: DOWN
- tapOn: 'Crear perfil'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 60000
# La otra mitad de `seekingSpecialties`: lo que busca OTRA persona, leído del
# backend y pintado en la tarjeta. `incoming-likes.sql` fija el orden del deck,
# así que arriba está Núria Bosch, que es `par` y por tanto tiene fila "Busca";
# el ✓ sale de cruzar lo que ella busca con lo que yo domino (marketing).
# Las etiquetas van en versales (`Typography.label`): de ahí el `(?i)`.
#
# Estas cuatro son las ÚNICAS líneas del recorrido que dependen de una fila que
# solo existe en Postgres: el `update` de `created_at` de `incoming-likes.sql`.
# Con el APK sin credenciales el deck lo ordena `src/data/mock/seed.ts` y arriba
# hay otra persona (run 34172803719, intento 2: Marc Oller), así que ahí no hay
# nada que afirmar — y el control negativo solo significa algo si llega al
# `stopApp`. Se saltan SOLO en esa variante; el resto del recorrido, reinicio y
# persistencia incluidos, es idéntico en las dos. Quien lo pone verde es la
# variante con credenciales, y ahí se ejecutan siempre.
- runFlow:
    when:
      true: ${DECK_FIXTURE == 'postgres'}
    commands:
      - assertVisible: 'Núria Bosch'
      - assertVisible: '(?i)busca'
      - assertVisible: '(?i)✓ marketing'
      - assertVisible: '(?i)✓ encajas'
# Fixture: solo likes entrantes. El like propio y el match pasan por UI/RPC.
- tapOn: 'Like'
- extendedWaitUntil:
    visible: '¡Match!'
    timeout: 30000
- tapOn: 'Abrir chat'
- extendedWaitUntil:
    visible: 'Mensaje'
    timeout: 30000
- tapOn: 'Mensaje'
- inputText: ${MESSAGE}
- tapOn: 'Enviar mensaje'
- hideKeyboard
# Esperar al editor vacío evita confundir borrador y burbuja enviada.
- assertVisible:
    text: 'Enviar mensaje'
    enabled: false
- assertVisible: ${MESSAGE}
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Descubrir'
    timeout: 60000
- assertNotVisible: 'Paso 1 de 2'
- tapOn: 'Perfil'
- extendedWaitUntil:
    visible: ${PROFILE_NAME}
    timeout: 30000
# `seekingSpecialties` propia, declarada en el formulario y releída de Postgres
# después del reinicio. "Diseño" solo puede venir de ahí: lo que domino en este
# recorrido es Desarrollo y Marketing.
- scrollUntilVisible:
    element: '(?i)lo que busca'
    direction: DOWN
- assertVisible: '(?i)lo que busca'
- assertVisible: 'Diseño'
- tapOn: 'Matches'
- extendedWaitUntil:
    visible: 'Conversación con .*${MESSAGE}'
    timeout: 30000
- tapOn: 'Conversación con .*${MESSAGE}'
- extendedWaitUntil:
    visible: ${MESSAGE}
    timeout: 30000
- assertVisible:
    text: 'Enviar mensaje'
    enabled: false
