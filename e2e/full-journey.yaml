# AVISO: si corre contra el mock NO demuestra integración con Supabase.
# active.ts elige por credenciales. seed.sql y mock/seed.ts tienen los mismos
# ocho nombres. La persistencia tras stopApp + launchApp distingue Postgres del
# estado en memoria de mock/store.ts. NO quitar el reinicio ni recrear el perfil.
# Ejecutar mediante run.mjs: además verifica las filas reales. No usar Expo Go.
# El orden del deck lo fija el `update` de `created_at` de `incoming-likes.sql`:
# lo que se afirma de la tarjeta son datos de una persona concreta, y sin un
# orden fijo no querrían decir nada. `full-journey.test.mjs` fija esa relación.
appId: app.cofounder.mobile
name: Alta, perfil, deck, match, mensaje y persistencia
---
- assertTrue: ${PROFILE_NAME && MESSAGE && (DECK_FIXTURE == 'postgres' || DECK_FIXTURE == 'memoria')}
# Registro actual: Auth anónimo automático; no existe pantalla de login.
- launchApp:
    clearState: true
# Bienvenida (desde el 2026-10-17): logo y dos salidas. Desde el 2026-10-12 no
# se elige modo, todo perfil es de cofundador. Sin la puerta del registro (mock,
# o `REQUIRE_ACCOUNT=false` en la variante supabase) «Registrarse» va de «Sobre
# ti» directo al perfil, sin cuenta ni correo.
- extendedWaitUntil:
    visible: 'Registrarse'
    timeout: 60000
- tapOn: 'Registrarse'
# «Sobre ti»: nombre, edad y de dónde eres, antes que nada.
- extendedWaitUntil:
    visible: 'Sobre ti'
    timeout: 30000
- tapOn:
    text: 'Nombre|Cómo te llamas'
    below: 'Nombre'
- inputText: ${PROFILE_NAME}
- hideKeyboard
- tapOn:
    text: 'Edad|28'
    below: 'Edad'
- inputText: '28'
- hideKeyboard
- tapOn: 'De dónde eres|Barcelona'
- inputText: 'Barcelona'
- hideKeyboard
- tapOn: 'Continuar'
# Términos y Normas: sin aceptarlos no se publica perfil (gate de profile-form).
- extendedWaitUntil:
    visible: 'Términos y Normas'
    timeout: 30000
- tapOn: 'He leído y acepto los Términos de uso y las Normas de la comunidad'
- tapOn: 'Aceptar y continuar'
# Nombre, edad y ubicación ya vienen de «Sobre ti»: no se vuelven a teclear.
- extendedWaitUntil:
    visible: ${PROFILE_NAME}
    timeout: 30000
- assertVisible: 'Barcelona'
- scrollUntilVisible:
    element: 'Desarrollo'
    direction: DOWN
- tapOn: 'Desarrollo'
# Marketing no es decorado: es lo que hace aparecer el ✓ en la primera tarjeta
# del deck, porque Núria busca marketing y ventas.
- scrollUntilVisible:
    element: 'Marketing'
    direction: DOWN
- tapOn: 'Marketing'
# "Lo que debe dominar quien busco". Solo se pinta con `par` o `ambos` —aquí,
# `ambos`—: es la invariante de `Profile.seekingSpecialties`. Se toca por su
# etiqueta de accesibilidad porque "Diseño" nombra dos chips de esta pantalla,
# el que domino y el que busco, y por texto visible serían el mismo.
- scrollUntilVisible:
    element: 'Busco Diseño'
    direction: DOWN
- tapOn: 'Busco Diseño'
- scrollUntilVisible:
    element: 'Solo ganas'
    direction: DOWN
- tapOn: 'Solo ganas'
- scrollUntilVisible:
    element: 'Tarde · 12–20'
    direction: DOWN
- tapOn: 'Tarde · 12–20'
- scrollUntilVisible:
    element: 'En serio, con equilibrio'
    direction: DOWN
- tapOn: 'En serio, con equilibrio'
- scrollUntilVisible:
    element:
      text: 'Lo que quiero construir es…|Tu respuesta'
      below: 'Busco a alguien que…'
    direction: DOWN
- tapOn:
    text: 'Lo que quiero construir es…|Tu respuesta'
    below: 'Busco a alguien que…'
- inputText: 'Una herramienta para construir en equipo'
- hideKeyboard
- scrollUntilVisible:
    element: 'Crear perfil'
    direction: DOWN
- tapOn: 'Crear perfil'
- extendedWaitUntil:
    visible: 'Like'
    timeout: 60000
# La otra mitad de `seekingSpecialties`: lo que busca OTRA persona, leído del
# backend y pintado en la tarjeta. `incoming-likes.sql` fija el orden del deck,
# así que arriba está Núria Bosch, que es `par` y por tanto tiene fila "Busca";
# el ✓ sale de cruzar lo que ella busca con lo que yo domino (marketing).
# Las etiquetas van en versales (`Typography.label`): de ahí el `(?i)`.
#
# Estas cuatro son las ÚNICAS líneas del recorrido que dependen de una fila que
# solo existe en Postgres: el `update` de `created_at` de `incoming-likes.sql`.
# Con el APK sin credenciales el deck lo ordena `src/data/mock/seed.ts` y delante
# hay otra persona (run 34172803719, intento 2: Lucía Pardo), así que ahí no hay
# nada que afirmar — y el control negativo solo significa algo si llega al
# `stopApp`. Se saltan SOLO en esa variante; el resto del recorrido, reinicio y
# persistencia incluidos, es idéntico en las dos. Quien lo pone verde es la
# variante con credenciales, y ahí se ejecutan siempre.
- runFlow:
    when:
      true: ${DECK_FIXTURE == 'postgres'}
    commands:
      - assertVisible: 'Núria Bosch'
      - assertVisible: '(?i)busca'
      - assertVisible: '(?i)✓ marketing'
      - assertVisible: '(?i)✓ encajas'
# Fixture: solo likes entrantes. El like propio y el match pasan por UI/RPC.
- tapOn: 'Like'
- extendedWaitUntil:
    visible: '¡Match!'
    timeout: 30000
- tapOn: 'Abrir chat'
- extendedWaitUntil:
    visible: 'Mensaje'
    timeout: 30000
- tapOn: 'Mensaje'
- inputText: ${MESSAGE}
- tapOn: 'Enviar mensaje'
# Aquí NO va un `hideKeyboard`, y no es un olvido. En Android ese comando es un
# `pressBack()`: con el teclado ya cerrado no se queda quieto, sale del chat. Se
# sostuvo mientras el teclado siguiera abierto tras el envío, pero eso es una
# trampa — el segundo bug de la ronda 4 lo cerraba (enviar desmontaba el
# compositor) y las dos aserciones de abajo pasaron a mirar Descubrir, con dos
# mensajes de error que no nombraban la causa. Ver `docs/plan/todo/chat.md`.
#
# Y no hace falta: el compositor queda por encima del teclado (rondas 1-4) y el
# hilo hace `scrollToEnd` al crecer (`src/app/chat/[matchId].tsx`), así que la
# burbuja recién enviada aparece justo encima de él. Afirmarlas con el teclado
# delante comprueba más, no menos. `hide-keyboard.test.mjs` fija esta ausencia.
#
# Esperar al editor vacío evita confundir borrador y burbuja enviada.
- assertVisible:
    text: 'Enviar mensaje'
    enabled: false
- assertVisible: ${MESSAGE}
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'Descubrir'
    timeout: 60000
- assertNotVisible: 'Registrarse'
- tapOn: 'Perfil'
- extendedWaitUntil:
    visible: ${PROFILE_NAME}
    timeout: 30000
# `seekingSpecialties` propia, declarada en el formulario y releída de Postgres
# después del reinicio. "Diseño" solo puede venir de ahí: lo que domino en este
# recorrido es Desarrollo y Marketing.
- scrollUntilVisible:
    element: '(?i)lo que busca'
    direction: DOWN
- assertVisible: '(?i)lo que busca'
- assertVisible: 'Diseño'
- tapOn: 'Matches'
- extendedWaitUntil:
    visible: 'Conversación con .*${MESSAGE}'
    timeout: 30000
- tapOn: 'Conversación con .*${MESSAGE}'
- extendedWaitUntil:
    visible: ${MESSAGE}
    timeout: 30000
- assertVisible:
    text: 'Enviar mensaje'
    enabled: false
