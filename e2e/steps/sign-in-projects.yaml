appId: app.cofounder.android
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 60000
- tapOn: 'Iniciar sesión'
- tapOn: 'Email de tu cuenta|tu@email.com'
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: 'Contraseña de tu cuenta|Tu contraseña'
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: 'Entrar'
