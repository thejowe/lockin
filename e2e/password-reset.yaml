# Dos pasadas del mismo flujo: request pide el correo; confirm continúa DESPUÉS
# del am start del runner, sin relanzar ni borrar el verificador PKCE.
appId: app.cofounder.mobile
name: Recuperar contraseña por correo
---
- assertTrue: ${EMAIL && NEW_PASSWORD && PROFILE_NAME && (PHASE == 'request' || PHASE == 'confirm')}
- runFlow:
    when:
      true: ${PHASE == 'request'}
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: 'Registrarse'
          timeout: 60000
      - tapOn: 'Iniciar sesión'
      - extendedWaitUntil:
          visible: 'Vuelve a tu cuenta'
          timeout: 30000
      - tapOn: 'Email de tu cuenta|tu@email.com'
      - inputText: ${EMAIL}
      - hideKeyboard
      - tapOn: 'He olvidado mi contraseña'
      - extendedWaitUntil:
          visible: 'Si ese email tiene una cuenta, te hemos mandado un correo para cambiar la contraseña.'
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'confirm'}
    commands:
      - extendedWaitUntil:
          visible: ${PROFILE_NAME}
          timeout: 60000
      - assertVisible: 'Matches'
      - assertNotVisible: 'Crea tu cuenta'
      # `centerElement` en los dos desplazamientos que preceden a un toque: la
      # barra de pestañas flota encima del contenido y Maestro da por visible lo
      # que queda debajo; el toque caía en la barra y saltaba a Matches (run
      # 37228331950). Guardia en `tab-bar-overlap.test.mjs`.
      # De vuelta del correo de recuperación, Perfil abre solo «Elige tu nueva
      # contraseña»: pide la nueva dos veces y no la actual (es la olvidada).
      - scrollUntilVisible:
          element: 'Nueva contraseña|La nueva'
          direction: DOWN
          centerElement: true
      - assertVisible: 'Elige tu nueva contraseña'
      - assertNotVisible: 'Contraseña actual'
      - assertVisible: 'Email de tu cuenta: ${EMAIL}'
      - tapOn: 'Nueva contraseña|La nueva'
      - inputText: ${NEW_PASSWORD}
      - hideKeyboard
      - scrollUntilVisible:
          element: 'Repite la nueva contraseña|Otra vez'
          direction: DOWN
          centerElement: true
      - tapOn: 'Repite la nueva contraseña|Otra vez'
      - inputText: ${NEW_PASSWORD}
      - hideKeyboard
      - scrollUntilVisible:
          element: 'Guardar contraseña'
          direction: DOWN
          centerElement: true
      - tapOn: 'Guardar contraseña'
      - scrollUntilVisible:
          element: 'Contraseña guardada. Ya puedes entrar con ella desde otro teléfono.'
          direction: DOWN
      - extendedWaitUntil:
          visible: 'Contraseña guardada. Ya puedes entrar con ella desde otro teléfono.'
          timeout: 30000
      - assertVisible: 'Matches'
