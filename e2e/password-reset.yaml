# Dos pasadas del mismo flujo: request pide el correo; confirm continúa DESPUÉS
# del am start del runner, sin relanzar ni borrar el verificador PKCE.
appId: app.cofounder.mobile
name: Recuperar contraseña por correo
---
- assertTrue: ${EMAIL && NEW_PASSWORD && PROFILE_NAME && (PHASE == 'request' || PHASE == 'confirm')}
- runFlow:
    when:
      true: ${PHASE == 'request'}
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: 'Registrarse'
          timeout: 60000
      - tapOn: 'Iniciar sesión'
      - extendedWaitUntil:
          visible: 'Vuelve a tu cuenta'
          timeout: 30000
      - tapOn: 'Email de tu cuenta|tu@email.com'
      - inputText: ${EMAIL}
      - hideKeyboard
      - tapOn: '¿Has olvidado la contraseña?'
      - extendedWaitUntil:
          visible: 'Reinicia tu contraseña'
          timeout: 30000
      - tapOn: 'Mandar enlace'
      - extendedWaitUntil:
          visible: 'Si ese email tiene una cuenta, te hemos mandado un correo para cambiar la contraseña.'
          timeout: 30000
- runFlow:
    when:
      true: ${PHASE == 'confirm'}
    commands:
      # De vuelta del correo de recuperación se abre directamente la hoja
      # «Elige tu nueva contraseña» (`/reset-password`, desde el 2026-10-30):
      # pide la nueva dos veces y no la actual (es la olvidada).
      - extendedWaitUntil:
          visible: 'Elige tu nueva contraseña'
          timeout: 60000
      - assertNotVisible: 'Crea tu cuenta'
      # `centerElement` en los desplazamientos que preceden a un toque: con la
      # barra de pestañas delante, Maestro daba por visible lo que quedaba
      # debajo (run 37228331950). Guardia en `tab-bar-overlap.test.mjs`.
      - scrollUntilVisible:
          element: 'Nueva contraseña|La nueva'
          direction: DOWN
          centerElement: true
      - assertVisible: 'Elige tu nueva contraseña'
      - assertNotVisible: 'Contraseña actual'
      - assertVisible: 'Email de tu cuenta: ${EMAIL}'
      - tapOn: 'Nueva contraseña|La nueva'
      - inputText: ${NEW_PASSWORD}
      - hideKeyboard
      - scrollUntilVisible:
          element: 'Repite la nueva contraseña|Otra vez'
          direction: DOWN
          centerElement: true
      - tapOn: 'Repite la nueva contraseña|Otra vez'
      - inputText: ${NEW_PASSWORD}
      - hideKeyboard
      - scrollUntilVisible:
          element: 'Guardar contraseña'
          direction: DOWN
          centerElement: true
      - tapOn: 'Guardar contraseña'
      - extendedWaitUntil:
          visible: 'Contraseña guardada. Ya puedes entrar con ella desde otro teléfono.'
          timeout: 30000
      - tapOn: 'Seguir'
      # Y de ahí a la app, con el perfil de esa cuenta.
      - extendedWaitUntil:
          visible: 'Matches'
          timeout: 30000
      - tapOn: 'Perfil'
      - extendedWaitUntil:
          visible: ${PROFILE_NAME}
          timeout: 30000
